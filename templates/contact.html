<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priyadarshini | Contact</title>
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">Priyadarshini</div>
      <nav class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/skills">Skills</a>
        <a href="/projects">Projects</a>
        <a href="/certifications">Certification</a>
        <a href="/achievements">Achievements</a>
        <a href="/contact">Contact</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Open navigation">☰</button>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-section contact-section">
      <h1>Contact Me</h1>
      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your Email" required />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Subject" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="formMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <script src="/frontend/js/script.js"></script>
</body>
</html>
